version: 1

scoring_scale:
  authority: "1-5, factual/source authority"
  taste_fit: "1-5, expected fit for this feed"
  signal_density: "1-5, proportion of useful material"
  commercial_bias: "1-5, higher means stronger commercial/PR incentives"

rules:
  primary_before_secondary_for_current_facts: true
  community_is_discovery_not_fact: true
  archive_sources_can_ignore_recency: true
  source_pool_is_expandable: true
  weekly_source_discovery_target: 5

